name: Mail System Diagnostic

permissions:
  contents: read

# workflow_dispatch ist erst verfuegbar, wenn die Datei auf master liegt.
# Auf dem Feature-Branch laeuft die Diagnose deshalb per push.
on:
  workflow_dispatch:
  push:
    branches: [claude/mail-system-issue-hv24jy]
    paths: ['.github/workflows/mail-diagnostic.yml']

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory the certificate setup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 8m
          script: |
            set +e
            MAILCOW_DIR=/opt/mailcow

            echo "=========================================="
            echo "1. Das vorhandene Erneuerungs-Skript"
            echo "=========================================="
            if [ -f /opt/renew-certs.sh ]; then
              echo "--- /opt/renew-certs.sh ---"
              cat /opt/renew-certs.sh
            else
              echo "(fehlt)"
            fi
            echo ""
            echo "--- Cron-Eintraege ---"
            for c in /etc/cron.d/certbot-mailcow /etc/cron.d/certbot-mailcow-renew; do
              echo "### $c"
              cat "$c" 2>/dev/null || echo "(fehlt)"
            done
            echo ""
            echo "--- Letzte Cron-Ausfuehrungen ---"
            grep -hiE 'renew-certs|certbot' /var/log/syslog /var/log/cron.log 2>/dev/null | tail -15
            echo ""

            echo "=========================================="
            echo "2. Wo liegt das FRISCHE Zertifikat wirklich?"
            echo "=========================================="
            echo "--- Host: /etc/letsencrypt ---"
            ls -la /etc/letsencrypt/live/ 2>/dev/null || echo "  (existiert auf dem Host nicht)"
            echo ""
            echo "--- Docker-Volumes mit certbot/letsencrypt ---"
            docker volume ls --format '{{.Name}}' | grep -iE 'certbot|letsencrypt'
            for v in $(docker volume ls --format '{{.Name}}' | grep -iE 'certbot|letsencrypt'); do
              MP=$(docker volume inspect -f '{{.Mountpoint}}' "$v" 2>/dev/null)
              echo ""
              echo "### Volume $v -> $MP"
              ls -la "$MP/live/" 2>/dev/null || echo "  (kein live/ Verzeichnis)"
            done
            echo ""
            echo "--- Certbot-Container ---"
            docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}' | grep -i certbot
            CBCT=$(docker ps -a --format '{{.Names}}' | grep -i certbot | head -1)
            [ -n "$CBCT" ] && docker logs --tail 25 "$CBCT" 2>&1 | cut -c1-200
            echo ""

            echo "=========================================="
            echo "3. Deckt das frische Zertifikat mail.* ab?"
            echo "=========================================="
            for v in $(docker volume ls --format '{{.Name}}' | grep -iE 'certbot|letsencrypt'); do
              MP=$(docker volume inspect -f '{{.Mountpoint}}' "$v" 2>/dev/null)
              for d in "$MP"/live/*/; do
                [ -f "$d/fullchain.pem" ] || continue
                echo "### $d"
                openssl x509 -in "$d/fullchain.pem" -noout -subject -dates 2>/dev/null | sed 's/^/    /'
                echo -n "    SANs: "
                openssl x509 -in "$d/fullchain.pem" -noout -ext subjectAltName 2>/dev/null \
                  | grep -v 'X509v3' | tr -d ' ' | head -1
                echo -n "    Fingerprint: "
                openssl x509 -in "$d/fullchain.pem" -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2
              done
            done
            echo ""
            echo "--- Was nginx auf 443 tatsaechlich ausliefert ---"
            echo | timeout 12 openssl s_client -connect karaarslan-bike.de:443 -servername mail.karaarslan-bike.de 2>/dev/null \
              | openssl x509 -noout -subject -dates -ext subjectAltName 2>/dev/null | grep -v 'X509v3' | sed 's/^/    /'
            echo ""

            echo "=========================================="
            echo "4. Mailcows aktuelle SSL-Dateien"
            echo "=========================================="
            ls -la "$MAILCOW_DIR/data/assets/ssl/" 2>/dev/null
            echo ""
            echo "--- cert.pem ---"
            openssl x509 -in "$MAILCOW_DIR/data/assets/ssl/cert.pem" -noout -subject -dates -fingerprint -sha256 2>/dev/null | sed 's/^/    /'
            echo -n "    SANs: "
            openssl x509 -in "$MAILCOW_DIR/data/assets/ssl/cert.pem" -noout -ext subjectAltName 2>/dev/null | grep -v 'X509v3' | tr -d ' ' | head -1
            echo ""
            echo "--- Passen key.pem und cert.pem zusammen? ---"
            CM=$(openssl x509 -in "$MAILCOW_DIR/data/assets/ssl/cert.pem" -noout -pubkey 2>/dev/null | openssl sha256 | cut -d= -f2)
            KM=$(openssl pkey -in "$MAILCOW_DIR/data/assets/ssl/key.pem" -pubout 2>/dev/null | openssl sha256 | cut -d= -f2)
            echo "    cert-pubkey: $CM"
            echo "    key-pubkey:  $KM"
            [ "$CM" = "$KM" ] && echo "    -> passen zusammen" || echo "    -> PASSEN NICHT ZUSAMMEN"
            echo ""

            echo "=========================================="
            echo "5. mailcow.conf — verwaltet mailcow selbst ACME?"
            echo "=========================================="
            grep -E '^(SKIP_LETS_ENCRYPT|MAILCOW_HOSTNAME|ADDITIONAL_SAN|HTTP_PORT|HTTPS_PORT|HTTP_BIND|HTTPS_BIND|ADDITIONAL_SERVER_NAMES)=' \
              "$MAILCOW_DIR/mailcow.conf" 2>/dev/null
            echo ""
            echo "--- acme-mailcow Logs ---"
            docker logs --tail 20 mailcow-acme-mailcow-1 2>&1 | cut -c1-200
            echo ""

            echo "=========================================="
            echo "6. Wie startet mailcow neu? (fuer den Reload)"
            echo "=========================================="
            echo "docker compose Version: $(docker compose version --short 2>/dev/null)"
            echo "Mailcow compose-Datei:  $(ls "$MAILCOW_DIR"/docker-compose.yml 2>/dev/null)"
            echo ""
            echo "=== INVENTAR ENDE ==="
            exit 0
